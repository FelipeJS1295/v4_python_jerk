{% extends "base.html" %}

{% block title %}Crear Trabajador{% endblock %}
{% block header %}Nuevo Trabajador{% endblock %}
{% block breadcrumb %}Configuración > Trabajadores > Crear{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white shadow-md rounded-xl p-6 space-y-6">
  <form method="post" action="/configuracion/trabajadores/crear">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <div>
        <label class="text-sm font-medium text-slate-700">Nombres *</label>
        <input type="text" name="nombres" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">Apellidos *</label>
        <input type="text" name="apellidos" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">Usuario Asociado</label>
        <select name="user_id" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
          <option value="">Sin asignar</option>
          {% for usuario in usuarios %}
            <option value="{{ usuario.id }}">{{ usuario.nombre_usuario }} ({{ usuario.email }})</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">RUT</label>
        <input type="text" name="rut" placeholder="Ej: 12.345.678-9" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">Teléfono</label>
        <input type="text" name="telefono" placeholder="Ej: +56 9 1234 5678" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">Dirección</label>
        <input type="text" name="direccion" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">Fecha Nacimiento</label>
        <input type="date" name="fecha_nacimiento" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">Fecha Ingreso</label>
        <input type="date" name="fecha_ingreso" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
      </div>

      <!-- AFP -->
      <div>
        <label class="text-sm font-medium text-slate-700">AFP</label>
        <select name="afp" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
          <option value="">Seleccionar AFP...</option>
          <option value="AFP Capital">AFP Capital</option>
          <option value="AFP Cuprum">AFP Cuprum</option>
          <option value="AFP Habitat">AFP Habitat</option>
          <option value="AFP Modelo">AFP Modelo</option>
          <option value="AFP PlanVital">AFP PlanVital</option>
          <option value="AFP Provida">AFP Provida</option>
          <option value="AFP Uno">AFP Uno</option>
        </select>
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">Salud</label>
        <select name="salud" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
          <option value="">Seleccionar salud...</option>
          <option value="Fonasa">Fonasa</option>
          <!-- Isapres Abiertas -->
          <option value="Isapre Banmédica">Isapre Banmédica</option>
          <option value="Isapre Colmena">Isapre Colmena</option>
          <option value="Isapre Consalud">Isapre Consalud</option>
          <option value="Isapre Cruz Blanca">Isapre Cruz Blanca</option>
          <option value="Isapre Nueva Masvida">Isapre Nueva Masvida</option>
          <option value="Isapre Vida Tres">Isapre Vida Tres</option>
          <option value="Isapre Esencial">Isapre Esencial</option>
          <!-- Isapres Cerradas -->
          <option value="Isapre de Codelco">Isapre de Codelco</option>
          <option value="Isapre Cruz del Norte">Isapre Cruz del Norte</option>
          <option value="Isapre Fundación">Isapre Fundación</option>
        </select>
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">Sueldo</label>
        <input type="number" step="1" name="sueldo" placeholder="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">Talla Polera</label>
        <select name="talla_polera" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
          <option value="">Seleccionar talla...</option>
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
          <option value="XXXL">XXXL</option>
        </select>
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">Talla Pantalón</label>
        <select name="talla_pantalon" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
          <option value="">Seleccionar talla...</option>
          <option value="28">28</option>
          <option value="30">30</option>
          <option value="32">32</option>
          <option value="34">34</option>
          <option value="36">36</option>
          <option value="38">38</option>
          <option value="40">40</option>
          <option value="42">42</option>
          <option value="44">44</option>
          <option value="46">46</option>
        </select>
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">Talla Zapatos</label>
        <select name="talla_zapatos" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
          <option value="">Seleccionar talla...</option>
          <option value="35">35</option>
          <option value="36">36</option>
          <option value="37">37</option>
          <option value="38">38</option>
          <option value="39">39</option>
          <option value="40">40</option>
          <option value="41">41</option>
          <option value="42">42</option>
          <option value="43">43</option>
          <option value="44">44</option>
          <option value="45">45</option>
          <option value="46">46</option>
        </select>
      </div>

      <!-- Banco -->
      <div>
        <label class="text-sm font-medium text-slate-700">Banco</label>
        <select name="banco" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
          <option value="">Seleccionar banco...</option>
          <option value="BancoEstado">BancoEstado</option>
          <option value="Banco de Chile">Banco de Chile</option>
          <option value="Banco Santander Chile">Banco Santander Chile</option>
          <option value="Banco de Crédito e Inversiones (BCI)">Banco de Crédito e Inversiones (BCI)</option>
          <option value="Scotiabank Chile">Scotiabank Chile</option>
          <option value="Itaú Corpbanca">Itaú Corpbanca</option>
          <option value="Banco Security">Banco Security</option>
          <option value="Banco BICE">Banco BICE</option>
          <option value="Banco Falabella">Banco Falabella</option>
          <option value="Banco Ripley">Banco Ripley</option>
          <option value="Banco Consorcio">Banco Consorcio</option>
          <option value="Banco Internacional">Banco Internacional</option>
          <option value="HSBC Bank (Chile)">HSBC Bank (Chile)</option>
          <option value="Banco BBVA (Chile)">Banco BBVA (Chile)</option>
          <option value="Banco BTG Pactual Chile">Banco BTG Pactual Chile</option>
          <option value="Banco Edwards">Banco Edwards</option>
          <option value="Banco Cencosud">Banco Cencosud</option>
          <option value="Banco París">Banco París</option>
          <option value="Tenpo">Tenpo</option>
        </select>
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">Tipo Cuenta</label>
        <select name="tipo_cuenta" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
          <option value="">Seleccionar...</option>
          <option value="Cuenta Corriente">Cuenta Corriente</option>
          <option value="Cuenta Vista">Cuenta Vista</option>
          <option value="Cuenta RUT">Cuenta RUT</option>
          <option value="Chequera Electrónica">Chequera Electrónica</option>
        </select>
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">Número Cuenta</label>
        <input type="text" name="numero_cuenta" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">Estado</label>
        <select name="estado" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
          <option value="activo" selected>Activo</option>
          <option value="inactivo">Inactivo</option>
        </select>
      </div>

    </div>

    <div class="pt-6 flex justify-end space-x-3">
      <a href="/configuracion/trabajadores" class="px-4 py-2 bg-slate-100 rounded-lg text-slate-700 hover:bg-slate-200 transition-colors">
        <i class="fas fa-times mr-2"></i>Cancelar
      </a>
      <button type="submit" class="px-6 py-2 bg-slate-700 text-white rounded-lg hover:bg-slate-800 transition-colors">
        <i class="fas fa-save mr-2"></i>Guardar Trabajador
      </button>
    </div>
  </form>
</div>
{% endblock %}
