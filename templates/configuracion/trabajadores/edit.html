{% extends "base.html" %}

{% block title %}Editar Trabajador{% endblock %}
{% block header %}Editar Trabajador{% endblock %}
{% block breadcrumb %}Configuración > Trabajadores > Editar{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white shadow-md rounded-xl p-6 space-y-6">
  <form method="post" action="/configuracion/trabajadores/{{ trabajador.id }}/actualizar">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <!-- Usuario asociado -->
      <div>
        <label class="text-sm font-medium text-slate-700">Talla Zapatos</label>
        <select name="talla_zapatos" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
          <option value="">Seleccionar talla...</option>
          <option value="35" {% if trabajador.talla_zapatos == '35' %}selected{% endif %}>35</option>
          <option value="36" {% if trabajador.talla_zapatos == '36' %}selected{% endif %}>36</option>
          <option value="37" {% if trabajador.talla_zapatos == '37' %}selected{% endif %}>37</option>
          <option value="38" {% if trabajador.talla_zapatos == '38' %}selected{% endif %}>38</option>
          <option value="39" {% if trabajador.talla_zapatos == '39' %}selected{% endif %}>39</option>
          <option value="40" {% if trabajador.talla_zapatos == '40' %}selected{% endif %}>40</option>
          <option value="41" {% if trabajador.talla_zapatos == '41' %}selected{% endif %}>41</option>
          <option value="42" {% if trabajador.talla_zapatos == '42' %}selected{% endif %}>42</option>
          <option value="43" {% if trabajador.talla_zapatos == '43' %}selected{% endif %}>43</option>
          <option value="44" {% if trabajador.talla_zapatos == '44' %}selected{% endif %}>44</option>
          <option value="45" {% if trabajador.talla_zapatos == '45' %}selected{% endif %}>45</option>
          <option value="46" {% if trabajador.talla_zapatos == '46' %}selected{% endif %}>46</option>
        </select>
      </div>

      <!-- Banco -->
      <div>
        <label class="text-sm font-medium text-slate-700">Banco</label>
        <select name="banco" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
          <option value="">Seleccionar banco...</option>
          <option value="BancoEstado" {% if trabajador.banco == 'BancoEstado' %}selected{% endif %}>BancoEstado</option>
          <option value="Banco de Chile" {% if trabajador.banco == 'Banco de Chile' %}selected{% endif %}>Banco de Chile</option>
          <option value="Banco Santander Chile" {% if trabajador.banco == 'Banco Santander Chile' %}selected{% endif %}>Banco Santander Chile</option>
          <option value="Banco de Crédito e Inversiones (BCI)" {% if trabajador.banco == 'Banco de Crédito e Inversiones (BCI)' %}selected{% endif %}>Banco de Crédito e Inversiones (BCI)</option>
          <option value="Scotiabank Chile" {% if trabajador.banco == 'Scotiabank Chile' %}selected{% endif %}>Scotiabank Chile</option>
          <option value="Itaú Corpbanca" {% if trabajador.banco == 'Itaú Corpbanca' %}selected{% endif %}>Itaú Corpbanca</option>
          <option value="Banco Security" {% if trabajador.banco == 'Banco Security' %}selected{% endif %}>Banco Security</option>
          <option value="Banco BICE" {% if trabajador.banco == 'Banco BICE' %}selected{% endif %}>Banco BICE</option>
          <option value="Banco Falabella" {% if trabajador.banco == 'Banco Falabella' %}selected{% endif %}>Banco Falabella</option>
          <option value="Banco Ripley" {% if trabajador.banco == 'Banco Ripley' %}selected{% endif %}>Banco Ripley</option>
          <option value="Banco Consorcio" {% if trabajador.banco == 'Banco Consorcio' %}selected{% endif %}>Banco Consorcio</option>
          <option value="Banco Internacional" {% if trabajador.banco == 'Banco Internacional' %}selected{% endif %}>Banco Internacional</option>
          <option value="HSBC Bank (Chile)" {% if trabajador.banco == 'HSBC Bank (Chile)' %}selected{% endif %}>HSBC Bank (Chile)</option>
          <option value="Banco BBVA (Chile)" {% if trabajador.banco == 'Banco BBVA (Chile)' %}selected{% endif %}>Banco BBVA (Chile)</option>
          <option value="Banco BTG Pactual Chile" {% if trabajador.banco == 'Banco BTG Pactual Chile' %}selected{% endif %}>Banco BTG Pactual Chile</option>
          <option value="Banco Edwards" {% if trabajador.banco == 'Banco Edwards' %}selected{% endif %}>Banco Edwards</option>
          <option value="Banco Cencosud" {% if trabajador.banco == 'Banco Cencosud' %}selected{% endif %}>Banco Cencosud</option>
          <option value="Banco París" {% if trabajador.banco == 'Banco París' %}selected{% endif %}>Banco París</option>
          <option value="Tenpo" {% if trabajador.banco == 'Tenpo' %}selected{% endif %}>Tenpo</option>
        </select>
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">Tipo Cuenta</label>
        <select name="tipo_cuenta" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
          <option value="">Seleccionar...</option>
          <option value="Cuenta Corriente" {% if trabajador.tipo_cuenta == 'Cuenta Corriente' %}selected{% endif %}>Cuenta Corriente</option>
          <option value="Cuenta Vista" {% if trabajador.tipo_cuenta == 'Cuenta Vista' %}selected{% endif %}>Cuenta Vista</option>
          <option value="Cuenta RUT" {% if trabajador.tipo_cuenta == 'Cuenta RUT' %}selected{% endif %}>Cuenta RUT</option>
          <option value="Chequera Electrónica" {% if trabajador.tipo_cuenta == 'Chequera Electrónica' %}selected{% endif %}>Chequera Electrónica</option>
        </select>
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">Número Cuenta</label>
        <input type="text" name="numero_cuenta" value="{{ trabajador.numero_cuenta }}" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
      </div>

      <div>
        <label class="text-sm font-medium text-slate-700">Estado</label>
        <select name="estado" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-transparent">
          <option value="activo" {% if trabajador.estado == 'activo' %}selected{% endif %}>Activo</option>
          <option value="inactivo" {% if trabajador.estado == 'inactivo' %}selected{% endif %}>Inactivo</option>
        </select>
      </div>

    </div>

    <div class="pt-6 flex justify-end space-x-3">
      <a href="/configuracion/trabajadores" class="px-4 py-2 bg-slate-100 rounded-lg text-slate-700 hover:bg-slate-200 transition-colors">
        <i class="fas fa-times mr-2"></i>Cancelar
      </a>
      <button type="submit" class="px-6 py-2 bg-slate-700 text-white rounded-lg hover:bg-slate-800 transition-colors">
        <i class="fas fa-save mr-2"></i>Actualizar Trabajador
      </button>
    </div>
  </form>
</div>
{% endblock %}
