{% extends "base.html" %}

{% block title %}Editar Usuario{% endblock %}
{% block header %}Editar Usuario{% endblock %}
{% block breadcrumb %}Configuración > Usuarios > Editar{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white shadow-md rounded-xl p-6 space-y-6">
  <form method="post" action="/configuracion/usuarios/{{ usuario.id }}/actualizar">
    <div class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nombre de Usuario</label>
        <input type="text" name="nombre_usuario" value="{{ usuario.nombre_usuario }}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" name="email" value="{{ usuario.email }}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Rol</label>
        <select name="rol" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring focus:ring-indigo-500">
          {% for r in ['Admin','Users','Tapicería','Costura','Esqueletería','Corte','Bodega'] %}
          <option value="{{ r }}" {% if usuario.rol == r %}selected{% endif %}>{{ r }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Estado</label>
        <select name="activo" class="w-full px-3 py-2 border border-slate-300 rounded-lg">
          <option value="1" {% if usuario.activo == 1 %}selected{% endif %}>Activo</option>
          <option value="0" {% if usuario.activo == 0 %}selected{% endif %}>Inactivo</option>
        </select>
      </div>
    </div>

    <div class="pt-6 flex justify-end space-x-3">
      <a href="/configuracion/usuarios" class="px-4 py-2 bg-slate-100 rounded-lg text-slate-700 hover:bg-slate-200">Cancelar</a>
      <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Actualizar Usuario</button>
    </div>
  </form>
</div>
{% endblock %}
