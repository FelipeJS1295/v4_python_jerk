{% extends "base.html" %}

{% block title %}Editar Usuario{% endblock %}
{% block header %}Editar Usuario{% endblock %}
{% block breadcrumb %}Configuración > Usuarios > Editar{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white shadow-md rounded-xl p-6 space-y-6">
  <form method="post" action="/configuracion/usuarios/{{ usuario.id }}/actualizar">
    <div class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nombre de Usuario</label>
        <input type="text" name="nombre_usuario" value="{{ usuario.nombre_usuario }}" required 
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" name="email" value="{{ usuario.email }}" required 
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500">
      </div>

      <!-- Campo de contraseña con opción de cambio -->
      <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
        <div class="flex items-center justify-between mb-3">
          <label class="block text-sm font-medium text-slate-700">Contraseña</label>
          <button type="button" id="togglePassword" 
                  class="text-sm text-slate-600 hover:text-slate-800 flex items-center">
            <i class="fas fa-key mr-1"></i>
            <span id="passwordToggleText">Cambiar contraseña</span>
          </button>
        </div>
        
        <div id="passwordFields" class="space-y-3" style="display: none;">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Nueva Contraseña</label>
            <input type="password" name="password" id="newPassword" 
                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Confirmar Contraseña</label>
            <input type="password" id="confirmPassword" 
                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500 text-sm">
          </div>
          <div id="passwordError" class="text-red-600 text-xs" style="display: none;"></div>
        </div>
        
        <div id="passwordInfo" class="text-xs text-slate-500 mt-2">
          Dejar vacío para mantener la contraseña actual
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Rol</label>
        <select name="rol" required 
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500">
          {% for r in ['Admin','Users','Tapicería','Costura','Esqueletería','Corte','Bodega'] %}
          <option value="{{ r }}" {% if usuario.rol == r %}selected{% endif %}>{{ r }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Estado</label>
        <select name="activo" 
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500">
          <option value="1" {% if usuario.activo == 1 %}selected{% endif %}>Activo</option>
          <option value="0" {% if usuario.activo == 0 %}selected{% endif %}>Inactivo</option>
        </select>
      </div>
    </div>

    <div class="pt-6 flex justify-end space-x-3">
      <a href="/configuracion/usuarios" 
         class="px-4 py-2 bg-slate-100 rounded-lg text-slate-700 hover:bg-slate-200 flex items-center">
        <i class="fas fa-arrow-left mr-2"></i>Cancelar
      </a>
      <button type="submit" id="submitBtn" 
              class="px-6 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-900 flex items-center">
        <i class="fas fa-save mr-2"></i>Actualizar Usuario
      </button>
    </div>
  </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordFields = document.getElementById('passwordFields');
    const passwordToggleText = document.getElementById('passwordToggleText');
    const passwordInfo = document.getElementById('passwordInfo');
    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const passwordError = document.getElementById('passwordError');
    const submitBtn = document.getElementById('submitBtn');
    
    let passwordVisible = false;
    
    togglePasswordBtn.addEventListener('click', function() {
        passwordVisible = !passwordVisible;
        
        if (passwordVisible) {
            passwordFields.style.display = 'block';
            passwordToggleText.textContent = 'Cancelar cambio';
            passwordInfo.textContent = 'Ingresa la nueva contraseña';
        } else {
            passwordFields.style.display = 'none';
            passwordToggleText.textContent = 'Cambiar contraseña';
            passwordInfo.textContent = 'Dejar vacío para mantener la contraseña actual';
            newPasswordInput.value = '';
            confirmPasswordInput.value = '';
            passwordError.style.display = 'none';
        }
    });
    
    function validatePasswords() {
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        
        if (passwordVisible && newPassword) {
            if (newPassword !== confirmPassword) {
                passwordError.textContent = 'Las contraseñas no coinciden';
                passwordError.style.display = 'block';
                return false;
            } else if (newPassword.length < 6) {
                passwordError.textContent = 'La contraseña debe tener al menos 6 caracteres';
                passwordError.style.display = 'block';
                return false;
            } else {
                passwordError.style.display = 'none';
                return true;
            }
        }
        
        passwordError.style.display = 'none';
        return true;
    }
    
    newPasswordInput.addEventListener('input', validatePasswords);
    confirmPasswordInput.addEventListener('input', validatePasswords);
    
    document.querySelector('form').addEventListener('submit', function(e) {
        if (!validatePasswords()) {
            e.preventDefault();
        }
    });
});
</script>
{% endblock %}
