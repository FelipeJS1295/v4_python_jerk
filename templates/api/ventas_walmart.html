{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto p-6 space-y-6">
    <div class="flex justify-between items-center bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
        <h1 class="text-2xl font-black text-slate-800">Logística <span class="text-blue-600">Walmart</span></h1>
        <button onclick="location.reload()"
            class="p-3 bg-slate-50 text-slate-400 hover:text-blue-600 rounded-xl transition-all">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <div class="space-y-3">
        {% for o in ordenes %}
        <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm hover:border-blue-300 transition-all">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-6 items-center text-center md:text-left">

                <div>
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">N° de
                        Orden</span>
                    <span class="text-sm font-bold text-slate-700">{{ o.numero_orden }}</span>
                </div>

                <div>
                    <span class="text-[10px] font-black text-red-400 uppercase tracking-widest block mb-1 italic">Límite
                        Despacho</span>
                    <span class="text-sm font-black text-red-600">{{ o.limite_despacho }}</span>
                </div>

                <div>
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Nombre
                        Cliente</span>
                    <span class="text-sm font-bold text-slate-800 uppercase">{{ o.cliente }}</span>
                </div>

                <div class="md:col-span-1">
                    <span
                        class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Producto</span>
                    <span class="text-xs font-bold text-slate-600 line-clamp-2">{{ o.producto }}</span>
                </div>

                <div class="text-right">
                    <span
                        class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1 text-center md:text-right">Estado</span>
                    <span
                        class="inline-block px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-tighter
                        {% if o.estado == 'Created' %}bg-amber-100 text-amber-700{% else %}bg-emerald-100 text-emerald-700{% endif %}">
                        {{ o.estado }}
                    </span>
                </div>

            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
